name: Build Windows MSI

on:
  workflow_dispatch:
    inputs:
      clean:
        description: Clean the OpenSSH build output before compiling
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-msi:
    name: Build OpenSSH x64 Release MSI
    runs-on: windows-2022

    steps:
      - name: Check out OpenSSH
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main

      - name: Check out vcpkg
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WiX Toolset if missing
        shell: pwsh
        run: |
          $installed = choco list --local-only --exact wixtoolset --limit-output 2>$null
          if (-not ($installed -match '^wixtoolset\|')) {
            choco install wixtoolset --no-progress --yes
          }
          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $wixTool = Get-ChildItem $wixRoot.FullName -Filter 'candle.exe' -File -Recurse |
            Select-Object -First 1
          $wixTargets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX" -Filter 'Wix.targets' -File -Recurse |
            Select-Object -First 1
          $wixTasks = Get-ChildItem $wixTool.Directory.FullName -Filter 'wixtasks.dll' -File |
            Select-Object -First 1
          if (-not $wixTool -or -not $wixTargets -or -not $wixTasks) {
            throw 'WiX compiler or MSBuild tasks were not found in the standard WiX installation.'
          }
          "WIX_TOOL_PATH=$($wixTool.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_TARGETS_PATH=$($wixTargets.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_TASKS_PATH=$($wixTasks.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Using WiX at $($wixRoot.FullName)"

      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          $result = .\.github\tools\Install-VcpkgDependencies.ps1 -Bootstrap
          if (-not $result.Success) {
            throw "Install-VcpkgDependencies failed: $($result.Message)"
          }
          $opensslHeader = Join-Path $env:GITHUB_WORKSPACE 'contrib\win32\openssh\vcpkg_installed\x64-custom\x64-custom\include\openssl\opensslv.h'
          if (-not (Test-Path $opensslHeader)) {
            throw "Expected OpenSSL compatibility header was not installed: $opensslHeader"
          }

      - name: Configure dependency library paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'contrib/win32/openssh'
          $libDir = Join-Path $projectDir 'vcpkg_installed/x64-custom/x64-custom/lib'
          $cryptoLib = Join-Path $libDir 'libcrypto.lib'

          if (-not (Test-Path -LiteralPath $cryptoLib -PathType Leaf)) {
            throw "Required LibreSSL import library missing: $cryptoLib"
          }

          $libDir = (Resolve-Path -LiteralPath $libDir).Path
          $changed = 0

          foreach ($project in Get-ChildItem -LiteralPath $projectDir -Filter '*.vcxproj') {
            $xml = [System.Xml.XmlDocument]::new()
            $xml.PreserveWhitespace = $true
            $xml.Load($project.FullName)

            $ns = [System.Xml.XmlNamespaceManager]::new($xml.NameTable)
            $ns.AddNamespace('m', $xml.DocumentElement.NamespaceURI)

            $linkSettings = $xml.SelectNodes(
              '/m:Project/m:ItemDefinitionGroup/m:Link',
              $ns
            )

            if ($linkSettings.Count -eq 0) {
              continue
            }

            foreach ($link in $linkSettings) {
              $directories = $link.SelectSingleNode(
                'm:AdditionalLibraryDirectories',
                $ns
              )

              if ($null -eq $directories) {
                $directories = $xml.CreateElement(
                  'AdditionalLibraryDirectories',
                  $xml.DocumentElement.NamespaceURI
                )
                $null = $link.AppendChild($directories)
                $directories.InnerText = '%(AdditionalLibraryDirectories)'
              }

              $directories.InnerText = "$libDir;$($directories.InnerText)"
            }

            $xml.Save($project.FullName)
            $changed++
            Write-Host "Configured linker paths: $($project.Name)"
          }

          if ($changed -eq 0) {
            throw 'No project linker settings were found.'
          }

          Write-Host "Updated $changed projects."
          Write-Host "Verified import library: $cryptoLib"

      - name: Build OpenSSH binaries
        id: build_binaries
        continue-on-error: true
        shell: pwsh
        env:
          CLEAN_BUILD: ${{ inputs.clean }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $ErrorActionPreference = 'Stop'

          $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE 'contrib/win32/openssh/vcpkg_installed/x64-custom/x64-custom'

          $includeDir = Join-Path $dependencyRoot 'include'
          $libraryDir = Join-Path $dependencyRoot 'lib'
          $opensslHeader = Join-Path $includeDir 'openssl/opensslv.h'

          if (-not (Test-Path -LiteralPath $opensslHeader -PathType Leaf)) {
            throw "LibreSSL header missing: $opensslHeader"
          }

          if (-not (Test-Path -LiteralPath $libraryDir -PathType Container)) {
            throw "Dependency library directory missing: $libraryDir"
          }

          $separator = [System.IO.Path]::DirectorySeparatorChar
          $includeDir = $includeDir.Replace([char]'/', $separator)
          $libraryDir = $libraryDir.Replace([char]'/', $separator)

          $env:INCLUDE = "$includeDir;$env:INCLUDE"
          $env:LIB = "$libraryDir;$env:LIB"

          Write-Host "Dependency includes: $includeDir"
          Write-Host "Dependency libraries: $libraryDir"

          $buildArgs = @{
            Configuration = 'Release'
            Architecture = 'x64'
          }

          if ($env:CLEAN_BUILD -eq 'true') {
            $buildArgs['Clean'] = $true
          }

          & './.github/tools/Start-OpenSSHBuild.ps1' @buildArgs
          
      - name: Diagnose OpenSSH build failure
        if: steps.build_binaries.outcome == 'failure'
        shell: pwsh
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE 'contrib\win32\openssh\OpenSSHReleasex64.log'
          if (Test-Path $logPath) {
            Write-Host 'MSBuild errors and warnings:'
            Select-String -Path $logPath -Pattern ': error ', ': warning ', 'Build FAILED' |
              Select-Object -Last 100 |
              ForEach-Object { Write-Host $_.Line }
          } else {
            Write-Host "Build log not found: $logPath"
          }
          throw 'OpenSSH binary build failed; see the diagnostic output and uploaded build log.'

      - name: Upload OpenSSH build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # main
        with:
          name: OpenSSH-x64-Release-build-log
          path: contrib/win32/openssh/OpenSSHReleasex64.log
          if-no-files-found: warn

      - name: Build MSI
        shell: pwsh
        run: |
          if (-not (Test-Path $env:WIX_TARGETS_PATH)) {
            throw "WiX MSBuild targets were not found at $env:WIX_TARGETS_PATH"
          }
          msbuild .\contrib\win32\install\openssh.wixproj `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:ProductVersion=10.6.0 `
            /p:WixToolPath="$env:WIX_TOOL_PATH\" `
            /p:WixTargetsPath="$env:WIX_TARGETS_PATH" `
            /p:WixTasksPath="$env:WIX_TASKS_PATH" `
            /m

      - name: Upload MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # main
        with:
          name: OpenSSH-Win64-v10.6.0.0
          path: contrib/win32/install/bin/x64/Release/openssh.msi
          if-no-files-found: error
