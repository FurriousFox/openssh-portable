name: Build Windows MSI

on:
  workflow_dispatch:
    inputs:
      clean:
        description: Clean the OpenSSH build output before compiling
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-msi:
    name: Build OpenSSH x64 Release MSI
    runs-on: windows-2022

    steps:
      - name: Check out OpenSSH
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main

      - name: Check out vcpkg
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $wixSearchRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.*'),
            (Join-Path ${env:ProgramFiles(x86)} 'MSBuild\Microsoft\WiX'),
            (Join-Path $env:ChocolateyInstall 'lib\wixtoolset\tools')
          )
          $wixTargets = Get-ChildItem -Path $wixSearchRoots -Filter 'Wix.targets' -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $wixTargets) {
            choco install wixtoolset --no-progress --yes
            $wixTargets = Get-ChildItem -Path $wixSearchRoots -Filter 'Wix.targets' -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $wixTargets) {
            throw 'WiX Toolset 3.x was not found after installation.'
          }
          $wixRoot = $wixTargets.Directory.Parent.FullName
          $wixTool = Get-ChildItem -Path $wixSearchRoots -Filter 'candle.exe' -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $wixTasks = Get-ChildItem -Path $wixSearchRoots -Filter 'wixtasks.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $wixTool -or -not $wixTasks) {
            throw 'WiX compiler or MSBuild tasks were not found.'
          }
          "WIX_TOOL_PATH=$($wixTool.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_TARGETS_PATH=$($wixTargets.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_TASKS_PATH=$($wixTasks.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Using WiX at $wixRoot"

      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: .\.github\tools\Install-VcpkgDependencies.ps1 -Bootstrap

      - name: Build OpenSSH binaries
        shell: pwsh
        env:
          CLEAN_BUILD: ${{ inputs.clean }}
        run: |
          $buildArgs = @{
            Configuration = 'Release'
            Architecture = 'x64'
          }
          if ($env:CLEAN_BUILD -eq 'true') {
            $buildArgs['Clean'] = $true
          }
          .\.github\tools\Start-OpenSSHBuild.ps1 @buildArgs

      - name: Build MSI
        shell: pwsh
        run: |
          if (-not (Test-Path $env:WIX_TARGETS_PATH)) {
            throw "WiX MSBuild targets were not found at $env:WIX_TARGETS_PATH"
          }
          msbuild .\contrib\win32\install\openssh.wixproj `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:ProductVersion=10.6.0 `
            /p:WixToolPath="$env:WIX_TOOL_PATH\" `
            /p:WixTargetsPath="$env:WIX_TARGETS_PATH" `
            /p:WixTasksPath="$env:WIX_TASKS_PATH" `
            /m

      - name: Upload MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # main
        with:
          name: OpenSSH-Win64-v10.6.0.0
          path: contrib/win32/install/bin/x64/Release/openssh.msi
          if-no-files-found: error
